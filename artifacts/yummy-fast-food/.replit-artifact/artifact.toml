kind = "web"
previewPath = "/"
title = "YummY Fast Food"
description = "A mobile-first official website for YummY Fast Food in Mandalay, featuring its signature chicken wings and Sichuan Mala skewers, with clear ordering, calling, directions, and social links."
version = "1.0.0"
id = "artifacts/yummy-fast-food"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20678

[services.development]
run = "pnpm --filter @workspace/yummy-fast-food run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yummy-fast-food", "run", "build" ]
serve = "static"
publicDir = "artifacts/yummy-fast-food/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20678"
BASE_PATH = "/"
